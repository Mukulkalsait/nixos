# Ultra-wide + dense formatting (Neovim + small font)   those with Y: marked are the once we have initially 

# Allow the use of unstable formatting options
unstable_features = true

# Language and Style editions
edition = "2024" # Language edition used for parsing the code                       Y: 
style_edition = "2024" # Style edition (controls the actual formatting rules)

# 1. Broad layout limits (Ultra-wide screen configuration)
max_width = 320 # Y: MAX WIDTH
use_small_heuristics = "Max"

# 2. Squeeze Method Chains onto a single line
# Prevents long chains like .bind().fetch().map_err() from breaking vertically
chain_width = 300
chain_one_line_max = 300

# 3. Squeeze Block Expressions and Closures
# This lets the .map_err(|e| { ... }) stay flat if it's under the width limit
fn_call_width = 320
attr_fn_like_width = 280

# 4. Squeeze Match Arms into single lines
# This strips block brackets from match arm expressions if they can fit horizontally
match_arm_blocks = false

# 5. Squeeze single lines, blocks, and definitions
fn_single_line = true
struct_lit_single_line = true
single_line_if_else_max_width = 280
single_line_let_else_max_width = 280
where_single_line = true
empty_item_single_line = true

# 6. Squeeze Arrays and Structures
array_width = 280
struct_lit_width = 280
struct_variant_width = 320

# 7. Imports Layout
imports_layout = "HorizontalVertical"
imports_granularity = "Module"
group_imports = "StdExternalCrate"
reorder_imports = true # Alphabetically record inputs Y: 

# 8. Extra Cleanups
use_field_init_shorthand = true # Prefer `Foo { x, y }` instead of `Foo { x: x, y: y }`
use_try_shorthand = true # Prefer `?` instead of `try!()`
trailing_comma = "Vertical" # Put trailing commas on multi-line lists (Vertical style)
 match_block_trailing_comma = true # Add trailing commas in match blocks
