os:
  edit: "nvim {{filename}}"
  editInTerminal: true

customCommands:
  - key: "X"
    command: "git commit -m '{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: {{.Form.Subject}}'"
    # command: "git commit -m '{{.Form.Type}}{{.Form.Scope}}: {{.Form.Subject}}'"
    context: "files"
    description: "Conventional commit"
    prompts:
      - type: "menu"
        title: "Select type"
        key: "Type"
        options:
          - name: "feat"
            value: "feat"
            description: "A new feature for the user"
          - name: "fix"
            value: "fix"
            description: "A bug fix"
          - name: "docs"
            value: "docs"
            description: "Documentation only changes"
          - name: "chore"
            value: "chore"
            description: "Maintenance, dependencies, config"
          - name: "refactor"
            value: "refactor"
            description: "Code change that neither fixes a bug nor adds a feature"
          - name: "test"
            value: "test"
            description: "Adding or correcting tests"
          - name: "style"
            value: "style"
            description: "Changes that do not affect the meaning of the code"
      - type: "input"
        title: "Scope (optional)"
        key: "Scope"
      - type: "input"
        title: "Description"
        key: "Subject"
